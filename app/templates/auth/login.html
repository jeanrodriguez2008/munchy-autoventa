{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card card-custom p-4 shadow">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Alimentos Munchy" class="img-fluid mb-2" style="max-height: 70px;">
                <h4 class="fw-bold text-dark">Alimentos Munchy</h4>
                <p class="text-muted small">MunchyAutoventa - Control de Pedidos</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-bold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label font-weight-bold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <div class="text-end mb-4">
                    <a href="{{ url_for('auth.recuperar') }}" class="text-decoration-none small text-danger fw-bold">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-danger btn-lg shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar Sesión
                    </button>
                </div>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-1">¿No tienes una cuenta de vendedor?</p>
                <a href="{{ url_for('auth.register') }}" class="btn btn-outline-danger btn-sm w-100 fw-bold">
                    <i class="fa-solid fa-user-plus me-1"></i>Registrarse Aquí
                </a>
            </div>
        </div>
        <div class="text-center mt-3 text-muted small">
            &copy; 2026 Alimentos Munchy, C.A. Todos los derechos reservados.
        </div>
    </div>
</div>
{% endblock %}
